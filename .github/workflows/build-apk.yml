name: Build Roverd APK

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git

      - name: Restore Roverd source
        run: |
          set -e

          if [ -f "roverd-android-source.zip" ]; then
            rm -rf _android_source
            mkdir -p _android_source
            unzip -q roverd-android-source.zip -d _android_source
            cp -a _android_source/. .
            rm -rf _android_source
          elif compgen -G "payload/part*" > /dev/null; then
            cat payload/part* > /tmp/roverd-source.b64
            base64 --decode /tmp/roverd-source.b64 > /tmp/roverd-source.zip

            rm -rf _android_source
            mkdir -p _android_source
            unzip -q /tmp/roverd-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source
            rm -f /tmp/roverd-source.b64 /tmp/roverd-source.zip
          else
            echo "ERROR: Android source not found."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653"

      - name: Download AndroidUSBCamera
        run: |
          set -e
          rm -rf /tmp/AndroidUSBCamera

          git clone \
            --depth 1 \
            --branch 3.3.3 \
            https://github.com/jiangdongguo/AndroidUSBCamera.git \
            /tmp/AndroidUSBCamera

      - name: Copy AndroidUSBCamera modules
        run: |
          set -e

          for module in libausbc libuvc libnative libuvccommon; do
            test -d "/tmp/AndroidUSBCamera/$module"
            rm -rf "$module"
            cp -a "/tmp/AndroidUSBCamera/$module" "./$module"
          done

      - name: Create compatibility Gradle files
        run: |
          set -e

          cat > libausbc/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          android {
              compileSdkVersion 36

              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 36
                  versionCode 1
                  versionName "1.0"
                  consumerProguardFiles "consumer-rules.pro"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "androidx.constraintlayout:constraintlayout:2.2.1"
              implementation "com.google.android.material:material:1.13.0"
              api "com.elvishew:xlog:1.11.0"
              implementation project(":libuvc")
              api project(":libnative")
          }
          EOF

          cat > libnative/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          android {
              compileSdkVersion 36

              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 36
                  versionCode 1
                  versionName "1.0.1"

                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags ""
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.15.0"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.13.0"
          }
          EOF

          cat > libuvc/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          import org.apache.tools.ant.taskdefs.condition.Os

          android {
              compileSdkVersion 36

              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 36
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile).configureEach {
              dependsOn ndkBuild
          }

          def ndkBuildPath = System.getenv("ANDROID_NDK_HOME")
          if (ndkBuildPath == null || ndkBuildPath.isEmpty()) {
              ndkBuildPath = System.getenv("ANDROID_NDK_ROOT")
          }

          if (ndkBuildPath == null || ndkBuildPath.isEmpty()) {
              ndkBuildPath = android.ndkDirectory.absolutePath
          }

          def ndkExecutable = Os.isFamily(Os.FAMILY_WINDOWS)
                  ? "${ndkBuildPath}/ndk-build.cmd"
                  : "${ndkBuildPath}/ndk-build"

          tasks.register("ndkBuild", Exec) {
              workingDir file("src/main")
              commandLine ndkExecutable, "-j2", "-C", file("src/main").absolutePath
          }

          dependencies {
              implementation fileTree(dir: new File(buildDir, "libs"), include: "*.jar")
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.elvishew:xlog:1.11.0"
              implementation project(":libuvccommon")
          }
          EOF

          test -d "libuvccommon" && cat > libuvccommon/build.gradle <<'EOF'
          apply plugin: 'com.android.library'

          android {
              compileSdkVersion 36

              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 36
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.15.0"
          }
          EOF
          true

      - name: Patch settings.gradle.kts
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("settings.gradle.kts")

          if not p.exists():
              raise SystemExit("settings.gradle.kts not found")

          s = p.read_text()

          modules = [
              ":libausbc",
              ":libuvc",
              ":libnative",
              ":libuvccommon",
          ]

          for module in modules:
              statement = f'include("{module}")'
              if statement not in s:
                  s += "\n" + statement

          p.write_text(s)
          PY

      - name: Patch app dependency on libausbc
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'implementation("com.github.jiangdongguo:AndroidUSBCamera:3.3.3")',
              'implementation(project(":libausbc"))'
          )

          s = s.replace(
              "implementation('com.github.jiangdongguo:AndroidUSBCamera:3.3.3')",
              'implementation(project(":libausbc"))'
          )

          s = s.replace(
              'implementation("com.github.jiangdongguo.AndroidUSBCamera:libausbc:3.3.3")',
              'implementation(project(":libausbc"))'
          )

          if 'implementation(project(":libausbc"))' not in s:
              s = s.replace(
                  "dependencies {",
                  'dependencies {\n    implementation(project(":libausbc"))',
                  1
              )

          p.write_text(s)
          PY

      - name: Show module configuration
        run: |
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts

          echo
          echo "=== app/build.gradle.kts (libausbc reference) ==="
          grep -n "libausbc\|AndroidUSBCamera" app/build.gradle.kts || echo "(no matches found)"

          echo
          echo "=== libausbc/build.gradle ==="
          cat libausbc/build.gradle

      - name: Restore optional signing key
        env:
          ROVER_SIGNING_P12_B64: ${{ secrets.ROVER_SIGNING_P12_B64 }}
        run: |
          if [ -n "$ROVER_SIGNING_P12_B64" ]; then
            mkdir -p signing

            printf '%s' "$ROVER_SIGNING_P12_B64" \
              | base64 --decode \
              > signing/roverd-update.p12

            chmod 600 signing/roverd-update.p12
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk roverd-android-debug.apk

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug roverd-android-debug.apk --clobber
          else
            gh release create latest-debug roverd-android-debug.apk \
              --title "Latest Roverd Debug APK" \
              --notes "Roverd with Logitech C920 UVC camera support and 180-degree camera inversion."
          fi
