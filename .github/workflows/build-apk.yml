name: Build Roverd APK

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Roverd
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git

      - name: Restore Roverd Android source
        run: |
          set -e

          if [ -f "roverd-android-source.zip" ]; then
            echo "Using roverd-android-source.zip"

            rm -rf _android_source
            mkdir -p _android_source

            unzip -q roverd-android-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source

          elif compgen -G "payload/part*" > /dev/null; then
            echo "Using payload parts"

            cat payload/part* > /tmp/roverd-source.b64
            base64 --decode /tmp/roverd-source.b64 > /tmp/roverd-source.zip

            rm -rf _android_source
            mkdir -p _android_source

            unzip -q /tmp/roverd-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source
            rm -f /tmp/roverd-source.b64
            rm -f /tmp/roverd-source.zip

          else
            echo "ERROR: Roverd Android source ZIP/payload not found."
            exit 1
          fi

      - name: Set up Java 11 for AndroidUSBCamera
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-29" \
            "platforms;android-31" \
            "build-tools;30.0.2" \
            "ndk;21.0.6113669" \
            "cmake;3.10.2.4988404"

      - name: Download AndroidUSBCamera 3.3.3
        run: |
          set -e

          rm -rf /tmp/AndroidUSBCamera

          git clone \
            --depth 1 \
            --branch 3.3.3 \
            https://github.com/jiangdongguo/AndroidUSBCamera.git \
            /tmp/AndroidUSBCamera

      - name: Build AndroidUSBCamera with its original Gradle project
        working-directory: /tmp/AndroidUSBCamera
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -e

          chmod +x ./gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

          echo "Building AUSBC library modules..."

          ./gradlew \
            :libutils:assembleRelease \
            :libuvccommon:assembleRelease \
            :libnative:assembleRelease \
            :libuvc:assembleRelease \
            :libausbc:assembleRelease \
            --stacktrace

      - name: Collect AUSBC AARs
        run: |
          set -e

          mkdir -p app/libs
          rm -f app/libs/ausbc-*.aar

          for aar in \
            /tmp/AndroidUSBCamera/libutils/build/outputs/aar/libutils-release.aar \
            /tmp/AndroidUSBCamera/libuvccommon/build/outputs/aar/libuvccommon-release.aar \
            /tmp/AndroidUSBCamera/libnative/build/outputs/aar/libnative-release.aar \
            /tmp/AndroidUSBCamera/libuvc/build/outputs/aar/libuvc-release.aar \
            /tmp/AndroidUSBCamera/libausbc/build/outputs/aar/libausbc-release.aar
          do
            if [ ! -f "$aar" ]; then
              echo "ERROR: Missing AUSBC AAR:"
              echo "$aar"
              exit 1
            fi

            cp "$aar" app/libs/ausbc-$(basename "$aar")
          done

          echo "AUSBC AARs:"
          ls -lh app/libs/ausbc-*.aar

      - name: Switch back to Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Patch Roverd app dependency
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          text = p.read_text()

          # Remove the broken published AUSBC dependency.
          text = re.sub(
              r'^\s*implementation\s*\(\s*["\']com\.github\.jiangdongguo:AndroidUSBCamera:3\.3\.3["\']\s*\)\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*implementation\s*\(\s*["\']com\.github\.jiangdongguo\.AndroidUSBCamera:libausbc:3\.3\.3["\']\s*\)\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove any previous project-module dependency we may have added.
          text = re.sub(
              r'^\s*implementation\s*\(\s*project\s*\(\s*["\']:libausbc["\']\s*\)\s*\)\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          dependency_block = """\
              implementation(files(
                  "libs/ausbc-libutils-release.aar",
                  "libs/ausbc-libuvccommon-release.aar",
                  "libs/ausbc-libnative-release.aar",
                  "libs/ausbc-libuvc-release.aar",
                  "libs/ausbc-libausbc-release.aar"
              ))
          """

          if 'libs/ausbc-libausbc-release.aar' not in text:
              if "dependencies {" not in text:
                  text += "\n\ndependencies {\n}\n"

              text = text.replace(
                  "dependencies {",
                  "dependencies {\n" + dependency_block,
                  1
              )

          p.write_text(text)
          PY

      - name: Configure Android SDK
        run: |
          printf '%s\n' \
            "sdk.dir=$ANDROID_HOME" \
            > local.properties

      - name: Verify AUSBC integration
        run: |
          set -e

          echo "Checking AUSBC AARs..."

          test -f app/libs/ausbc-libutils-release.aar
          test -f app/libs/ausbc-libuvccommon-release.aar
          test -f app/libs/ausbc-libnative-release.aar
          test -f app/libs/ausbc-libuvc-release.aar
          test -f app/libs/ausbc-libausbc-release.aar

          echo "Checking app Gradle file..."

          grep -F 'libs/ausbc-libausbc-release.aar' \
            app/build.gradle.kts

          if grep -E \
            'AndroidUSBCamera:3\.3\.3|project\(.*libausbc' \
            app/build.gradle.kts; then
            echo "ERROR: Old AUSBC dependency still present."
            exit 1
          fi

          echo "AUSBC integration checks passed."

      - name: Restore optional signing key
        env:
          ROVER_SIGNING_P12_B64: ${{ secrets.ROVER_SIGNING_P12_B64 }}
        run: |
          if [ -n "$ROVER_SIGNING_P12_B64" ]; then
            mkdir -p signing

            printf '%s' "$ROVER_SIGNING_P12_B64" \
              | base64 --decode \
              > signing/roverd-update.p12

            chmod 600 signing/roverd-update.p12
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Roverd APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            roverd-android-debug.apk

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload \
              latest-debug \
              roverd-android-debug.apk \
              --clobber
          else
            gh release create \
              latest-debug \
              roverd-android-debug.apk \
              --title "Latest Roverd Debug APK" \
              --notes "Roverd with Logitech C920 UVC camera support and 180-degree camera inversion."
          fi
