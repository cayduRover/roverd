name: Build Roverd APK

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653"

      - name: Install unzip and git
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git

      - name: Restore Roverd source
        run: |
          set -e

          if [ -f "roverd-android-source.zip" ]; then
            rm -rf _android_source
            mkdir _android_source
            unzip -q roverd-android-source.zip -d _android_source
            cp -a _android_source/. .
            rm -rf _android_source
          elif compgen -G "payload/part*" > /dev/null; then
            cat payload/part* > /tmp/roverd-source.b64
            base64 --decode /tmp/roverd-source.b64 > /tmp/roverd-source.zip

            rm -rf _android_source
            mkdir _android_source
            unzip -q /tmp/roverd-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source
            rm -f /tmp/roverd-source.b64 /tmp/roverd-source.zip
          else
            echo "ERROR: Roverd source not found."
            exit 1
          fi

      - name: Download AndroidUSBCamera 3.3.3
        run: |
          set -e

          rm -rf /tmp/AndroidUSBCamera

          git clone \
            --depth 1 \
            --branch 3.3.3 \
            https://github.com/jiangdongguo/AndroidUSBCamera.git \
            /tmp/AndroidUSBCamera

      - name: Build AndroidUSBCamera
        working-directory: /tmp/AndroidUSBCamera
        run: |
          set -e
          chmod +x gradlew
          ./gradlew \
            :libutils:assembleRelease \
            :libuvccommon:assembleRelease \
            :libnative:assembleRelease \
            :libuvc:assembleRelease \
            :libausbc:assembleRelease \
            --stacktrace

      - name: Copy AUSBC AARs
        run: |
          set -e

          mkdir -p app/libs

          cp /tmp/AndroidUSBCamera/libutils/build/outputs/aar/libutils-release.aar \
            app/libs/ausbc-libutils-release.aar

          cp /tmp/AndroidUSBCamera/libuvccommon/build/outputs/aar/libuvccommon-release.aar \
            app/libs/ausbc-libuvccommon-release.aar

          cp /tmp/AndroidUSBCamera/libnative/build/outputs/aar/libnative-release.aar \
            app/libs/ausbc-libnative-release.aar

          cp /tmp/AndroidUSBCamera/libuvc/build/outputs/aar/libuvc-release.aar \
            app/libs/ausbc-libuvc-release.aar

          cp /tmp/AndroidUSBCamera/libausbc/build/outputs/aar/libausbc-release.aar \
            app/libs/ausbc-libausbc-release.aar

      - name: Patch app dependency
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'^\s*implementation\s*\(\s*["\']com\.github\.jiangdongguo[.:]AndroidUSBCamera[^"\']*["\']\s*\)\s*$',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^\s*implementation\s*\(\s*project\s*\(\s*["\']:libausbc["\']\s*\)\s*\)\s*$',
              '',
              s,
              flags=re.MULTILINE
          )

          aar_block = '''    implementation(files(
        "libs/ausbc-libutils-release.aar",
        "libs/ausbc-libuvccommon-release.aar",
        "libs/ausbc-libnative-release.aar",
        "libs/ausbc-libuvc-release.aar",
        "libs/ausbc-libausbc-release.aar"
    ))
'''

          if "libs/ausbc-libausbc-release.aar" not in s:
              s = s.replace("dependencies {", "dependencies {\n" + aar_block, 1)

          p.write_text(s)
          PY

      - name: Configure Android SDK
        run: |
          printf '%s\n' "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Roverd APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
