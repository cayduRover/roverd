name: Build Roverd APK

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git

      - name: Restore Roverd source
        run: |
          set -e

          if [ -f "roverd-android-source.zip" ]; then
            echo "Using roverd-android-source.zip"

            rm -rf _android_source
            mkdir -p _android_source

            unzip -q roverd-android-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source

          elif compgen -G "payload/part*" > /dev/null; then
            echo "Using payload parts"

            cat payload/part* > /tmp/roverd-source.b64
            base64 --decode /tmp/roverd-source.b64 > /tmp/roverd-source.zip

            rm -rf _android_source
            mkdir -p _android_source

            unzip -q /tmp/roverd-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source
            rm -f /tmp/roverd-source.b64
            rm -f /tmp/roverd-source.zip

          else
            echo "ERROR: No Roverd Android source found."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653"

      - name: Download AndroidUSBCamera 3.3.3
        run: |
          set -e

          rm -rf /tmp/AndroidUSBCamera

          git clone \
            --depth 1 \
            --branch 3.3.3 \
            https://github.com/jiangdongguo/AndroidUSBCamera.git \
            /tmp/AndroidUSBCamera

      - name: Install AndroidUSBCamera modules
        run: |
          set -e

          for module in \
            libutils \
            libausbc \
            libuvc \
            libnative \
            libuvccommon
          do
            if [ ! -d "/tmp/AndroidUSBCamera/$module" ]; then
              echo "ERROR: Missing AndroidUSBCamera module: $module"
              exit 1
            fi

            rm -rf "$module"
            cp -a "/tmp/AndroidUSBCamera/$module" "./$module"
          done

      - name: Patch AndroidUSBCamera modules
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          modules = [
              "libutils",
              "libausbc",
              "libuvc",
              "libnative",
              "libuvccommon",
          ]

          for module in modules:
              gradle = Path(module) / "build.gradle"

              if not gradle.exists():
                  print(f"{module}: no build.gradle, skipping")
                  continue

              text = gradle.read_text()

              # Remove the legacy Kotlin plugin request.
              text = re.sub(
                  r'^\s*id\s+[\'"]kotlin-android[\'"]\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              text = re.sub(
                  r'^\s*apply plugin:\s*[\'"]kotlin-android[\'"]\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              # Remove legacy Maven publishing plugin.
              text = re.sub(
                  r'^\s*apply plugin:\s*[\'"]com\.github\.dcendents\.android-maven[\'"]\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )

              gradle.write_text(text)

          # libausbc needs the local UVC/native modules.
          p = Path("libausbc/build.gradle")
          text = p.read_text()

          if "implementation project(path: ':libuvc')" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n    implementation project(path: ':libuvc')",
                      1
                  )

          if "api project(path: ':libnative')" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n    api project(path: ':libnative')",
                      1
                  )

          p.write_text(text)

          # libuvc needs libuvccommon.
          p = Path("libuvc/build.gradle")
          text = p.read_text()

          if "implementation project(path: ':libuvccommon')" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n    implementation project(path: ':libuvccommon')",
                      1
                  )

          p.write_text(text)

          # Make the old module Gradle files use the installed SDK.
          for module in modules:
              p = Path(module) / "build.gradle"

              if not p.exists():
                  continue

              text = p.read_text()

              text = text.replace(
                  "compileSdkVersion rootProject.ext.versionCompiler",
                  "compileSdkVersion 36"
              )

              text = text.replace(
                  "buildToolsVersion rootProject.ext.versionBuildTool",
                  ""
              )

              text = text.replace(
                  "sourceCompatibility rootProject.ext.javaSourceCompatibility",
                  "sourceCompatibility JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "targetCompatibility rootProject.ext.javaTargetCompatibility",
                  "targetCompatibility JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "minSdkVersion rootProject.ext.minSdkVersion",
                  "minSdkVersion 21"
              )

              text = text.replace(
                  "targetSdkVersion rootProject.ext.versionTarget",
                  "targetSdkVersion 36"
              )

              p.write_text(text)
          PY

      - name: Patch AndroidUSBCamera settings
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("settings.gradle.kts")

          if not p.exists():
              raise SystemExit("settings.gradle.kts not found")

          text = p.read_text()

          modules = [
              ":libutils",
              ":libausbc",
              ":libuvc",
              ":libnative",
              ":libuvccommon",
          ]

          for module in modules:
              include_line = f'include("{module}")'

              if include_line not in text:
                  text += "\n" + include_line

          p.write_text(text)
          PY

      - name: Patch app dependency
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("app/build.gradle.kts not found")

          text = p.read_text()

          old_values = [
              'implementation("com.github.jiangdongguo:AndroidUSBCamera:3.3.3")',
              "implementation('com.github.jiangdongguo:AndroidUSBCamera:3.3.3')",
              'implementation("com.github.jiangdongguo.AndroidUSBCamera:libausbc:3.3.3")',
              "implementation('com.github.jiangdongguo.AndroidUSBCamera:libausbc:3.3.3')",
          ]

          for old in old_values:
              text = text.replace(
                  old,
                  'implementation(project(":libausbc"))'
              )

          if 'implementation(project(":libausbc"))' not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      'dependencies {\n    implementation(project(":libausbc"))',
                      1
                  )

          p.write_text(text)
          PY

      - name: Configure NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Create local.properties
        run: |
          printf '%s\n' \
            "sdk.dir=$ANDROID_HOME" \
            "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" \
            > local.properties

      - name: Validate Gradle files
        run: |
          set -e

          echo "Checking required modules..."

          test -f libutils/build.gradle
          test -f libausbc/build.gradle
          test -f libuvc/build.gradle
          test -f libnative/build.gradle
          test -f libuvccommon/build.gradle

          echo "Checking app dependency..."

          grep -F 'implementation(project(":libausbc"))' \
            app/build.gradle.kts

          echo "Checking module includes..."

          grep -F 'include(":libutils")' settings.gradle.kts
          grep -F 'include(":libausbc")' settings.gradle.kts
          grep -F 'include(":libuvc")' settings.gradle.kts
          grep -F 'include(":libnative")' settings.gradle.kts
          grep -F 'include(":libuvccommon")' settings.gradle.kts

          echo "Gradle configuration checks passed."

      - name: Restore optional signing key
        env:
          ROVER_SIGNING_P12_B64: ${{ secrets.ROVER_SIGNING_P12_B64 }}
        run: |
          if [ -n "$ROVER_SIGNING_P12_B64" ]; then
            mkdir -p signing

            printf '%s' "$ROVER_SIGNING_P12_B64" \
              | base64 --decode \
              > signing/roverd-update.p12

            chmod 600 signing/roverd-update.p12
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk roverd-android-debug.apk

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload \
              latest-debug \
              roverd-android-debug.apk \
              --clobber
          else
            gh release create \
              latest-debug \
              roverd-android-debug.apk \
              --title "Latest Roverd Debug APK" \
              --notes "Roverd with Logitech C920 UVC camera support and 180-degree camera inversion."
          fi
