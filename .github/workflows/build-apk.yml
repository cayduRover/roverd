name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android source
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'roverd-android-source.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: roverd-android-source.zip was not found."
            echo "Repository contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found source ZIP: $ZIP_FILE"

          mkdir -p android-source
          unzip -q -o "$ZIP_FILE" -d android-source

          echo "Extracted source tree:"
          find android-source -maxdepth 5 -type f | sort

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=""

          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"

            if [ -d "$candidate/app" ] && \
               { [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ]; }; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(
            find android-source \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -type f | sort
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not find an Android Gradle project containing:"
            echo "  settings.gradle or settings.gradle.kts"
            echo "  app/"
            echo
            echo "Extracted tree:"
            find android-source -maxdepth 8 -print | sort
            exit 1
          fi

          PROJECT_ROOT="$(realpath "$PROJECT_ROOT")"

          echo "ANDROID_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project root:"
          echo "$PROJECT_ROOT"

          echo
          echo "Project contents:"
          find "$PROJECT_ROOT" -maxdepth 3 -print | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Restore permanent APK signing key
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        run: |
          set -e

          if [ ! -f signing/roverd-update.p12.b64 ]; then
            echo "No permanent signing key found."
            echo "Continuing with normal debug signing."
            exit 0
          fi

          mkdir -p signing

          base64 --decode \
            signing/roverd-update.p12.b64 \
            > signing/roverd-update.p12

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Show Gradle project
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        run: |
          echo "Working directory:"
          pwd

          echo
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradlew" \) \
            -print | sort

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        run: |
          set -e

          if [ -x "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Locate APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        run: |
          set -e

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            find app/build/outputs -maxdepth 6 -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Found APK: $APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: ${{ env.ANDROID_PROJECT_ROOT }}/${{ env.APK_PATH }}
          retention-days: 30

      - name: Copy APK for release upload
        run: |
          cp "${ANDROID_PROJECT_ROOT}/${APK_PATH}" roverd-android-debug.apk

      - name: Publish latest-debug GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          git tag -f latest-debug "$GITHUB_SHA"
          git push origin refs/tags/latest-debug --force

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload \
              latest-debug \
              roverd-android-debug.apk \
              --clobber
          else
            gh release create \
              latest-debug \
              roverd-android-debug.apk \
              --title "Latest Debug Build" \
              --notes "Automatically built debug APK from the latest main branch commit." \
              --prerelease
          fi
