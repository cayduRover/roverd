name: Build Roverd APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble modified Android source
        run: |
          set -e
          cat payload/part* > /tmp/roverd-source.b64
          base64 --decode /tmp/roverd-source.b64 > /tmp/roverd-source.zip
          rm -rf _android_source
          mkdir _android_source
          unzip -q /tmp/roverd-source.zip -d _android_source
          cp -a _android_source/. .
          rm -rf _android_source /tmp/roverd-source.b64 /tmp/roverd-source.zip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore optional signing key
        env:
          ROVER_SIGNING_P12_B64: ${{ secrets.ROVER_SIGNING_P12_B64 }}
        run: |
          if [ -n "$ROVER_SIGNING_P12_B64" ]; then
            mkdir -p signing
            printf '%s' "$ROVER_SIGNING_P12_B64" | base64 --decode > signing/roverd-update.p12
            chmod 600 signing/roverd-update.p12
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk roverd-android-debug.apk
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug roverd-android-debug.apk --clobber
          else
            gh release create latest-debug roverd-android-debug.apk --title "Latest Roverd Debug APK" --notes "Roverd with Logitech C920 UVC camera support and 180-degree camera inversion."
          fi
