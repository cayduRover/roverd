name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.4.0 requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Ensures ANDROID_HOME and sdkmanager are on PATH.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk = 36 → platform 36 + matching build-tools.
      # AGP 9.4.0 default build-tools is 36.0.0.
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # The signing key is committed as a base64 blob; decode it before
      # Gradle runs so app/build.gradle.kts sees roverSigningFile.exists()=true.
      - name: Restore permanent APK signing key
        run: |
          base64 --decode signing/roverd-update.p12.b64 > signing/roverd-update.p12
          echo "a9c266a7f03a029bbd221c1a1994b25da9bfbbab05f44ac90cd0d8f8e5836c41  signing/roverd-update.p12" | sha256sum -c -

      # The repository has no gradlew wrapper; supply Gradle 9.6.0 directly.
      # AGP 9.4.0 minimum required Gradle is 9.6.0.
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Copy APK for release upload
        run: cp app/build/outputs/apk/debug/app-debug.apk roverd-android-debug.apk

      # Only publish a GitHub Release on main branch non-PR pushes.
      - name: Publish latest-debug GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-debug "$GITHUB_SHA"
          git push origin refs/tags/latest-debug --force

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug roverd-android-debug.apk --clobber
          else
            gh release create latest-debug roverd-android-debug.apk \
              --title "Latest Debug Build" \
              --notes "Automatically built debug APK from the latest main branch commit." \
              --prerelease
          fi
