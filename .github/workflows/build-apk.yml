name: Build Roverd APK

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip git

      - name: Restore Roverd source
        run: |
          set -e

          if [ -f "roverd-android-source.zip" ]; then
            rm -rf _android_source
            mkdir -p _android_source
            unzip -q roverd-android-source.zip -d _android_source
            cp -a _android_source/. .
            rm -rf _android_source
          elif compgen -G "payload/part*" > /dev/null; then
            cat payload/part* > /tmp/roverd-source.b64
            base64 --decode /tmp/roverd-source.b64 > /tmp/roverd-source.zip

            rm -rf _android_source
            mkdir -p _android_source
            unzip -q /tmp/roverd-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source
            rm -f /tmp/roverd-source.b64 /tmp/roverd-source.zip
          else
            echo "ERROR: Android source not found."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653"

      - name: Download AndroidUSBCamera
        run: |
          set -e
          rm -rf /tmp/AndroidUSBCamera

          git clone \
            --depth 1 \
            --branch 3.3.3 \
            https://github.com/jiangdongguo/AndroidUSBCamera.git \
            /tmp/AndroidUSBCamera

      - name: Copy AndroidUSBCamera modules
        run: |
          set -e

          for module in libausbc libuvc libnative libuvccommon; do
            test -d "/tmp/AndroidUSBCamera/$module"
            rm -rf "$module"
            cp -a "/tmp/AndroidUSBCamera/$module" "./$module"
          done

      - name: Patch AUSBC Gradle files and settings
        run: |
          set -e

          # Step 1: Remove all Kotlin plugin declarations from module build.gradle files
          python3 << 'PYTHON_PATCH'
from pathlib import Path

modules = [
    "libausbc",
    "libuvc",
    "libnative",
    "libuvccommon",
]

for module in modules:
    p = Path(module) / "build.gradle"

    if not p.exists():
        continue

    s = p.read_text()

    # Remove kotlin-android plugin in all its variants
    s = s.replace("id 'kotlin-android'", "")
    s = s.replace('id "kotlin-android"', "")
    s = s.replace("apply plugin: 'kotlin-android'", "")
    s = s.replace('apply plugin: "kotlin-android"', "")
    
    # Remove kotlin-kapt plugin  
    s = s.replace("id 'kotlin-kapt'", "")
    s = s.replace('id "kotlin-kapt"', "")
    s = s.replace("apply plugin: 'kotlin-kapt'", "")
    s = s.replace('apply plugin: "kotlin-kapt"', "")

    # Remove obsolete Maven publishing plugin
    s = s.replace("apply plugin: 'com.github.dcendents.android-maven'", "")
    s = s.replace('apply plugin: "com.github.dcendents.android-maven"', "")

    # Remove lines containing dcendents (maven publishing)
    lines = []
    for line in s.splitlines():
        if "com.github.dcendents" not in line:
            lines.append(line)

    p.write_text("\n".join(lines) + "\n")

# Step 2: Ensure inter-module dependencies are correctly declared
p = Path("libausbc/build.gradle")
if p.exists():
    s = p.read_text()
    
    if "dependencies {" in s:
        # Add libuvc dependency
        if "implementation project(':libuvc')" not in s and "api project(':libuvc')" not in s:
            s = s.replace(
                "dependencies {",
                "dependencies {\n    implementation project(':libuvc')",
                1
            )
        
        # Add libnative dependency
        if "implementation project(':libnative')" not in s and "api project(':libnative')" not in s:
            s = s.replace(
                "dependencies {",
                "dependencies {\n    api project(':libnative')",
                1
            )
    
    p.write_text(s)

p = Path("libuvc/build.gradle")
if p.exists():
    s = p.read_text()
    
    if "dependencies {" in s:
        # Add libuvccommon dependency
        if "implementation project(':libuvccommon')" not in s:
            s = s.replace(
                "dependencies {",
                "dependencies {\n    implementation project(':libuvccommon')",
                1
            )
    
    p.write_text(s)

# Step 3: Update app build.gradle to use libausbc
p = Path("app/build.gradle.kts")
if p.exists():
    s = p.read_text()
    
    # Remove old dependency
    s = s.replace(
        'implementation("com.github.jiangdongguo:AndroidUSBCamera:3.3.3")',
        ""
    )
    s = s.replace(
        "implementation('com.github.jiangdongguo:AndroidUSBCamera:3.3.3')",
        ""
    )
    s = s.replace(
        'implementation("com.github.jiangdongguo.AndroidUSBCamera:libausbc:3.3.3")',
        ""
    )
    
    # Add new dependency if not present
    if 'implementation(project(":libausbc"))' not in s:
        s = s.replace(
            "dependencies {",
            'dependencies {\n    implementation(project(":libausbc"))',
            1
        )
    
    p.write_text(s)

PYTHON_PATCH

      - name: Update settings.gradle.kts
        run: |
          set -e

          python3 << 'PYTHON_SETTINGS'
from pathlib import Path

p = Path("settings.gradle.kts")

if not p.exists():
    # Create a new settings.gradle.kts if it doesn't exist
    content = """pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "roverd"

include(":app")
include(":libausbc")
include(":libuvc")
include(":libnative")
include(":libuvccommon")
"""
    p.write_text(content)
else:
    # Ensure all modules are included
    s = p.read_text()

    modules = [
        ":libausbc",
        ":libuvc",
        ":libnative",
        ":libuvccommon",
    ]

    for module in modules:
        # Try both include() and include("") syntax
        if f'include("{module}")' not in s and f"include('{module}')" not in s:
            # Append at end if not present
            s += f'\ninclude("{module}")'

    p.write_text(s)

PYTHON_SETTINGS

      - name: Show module configuration
        run: |
          echo "=== settings.gradle.kts ==="
          head -30 settings.gradle.kts

          echo
          echo "=== app/build.gradle.kts (libausbc reference) ==="
          grep -n "libausbc\|AndroidUSBCamera" app/build.gradle.kts || echo "(no matches found)"

          echo
          echo "=== libausbc/build.gradle (plugins section) ==="
          grep -n "plugins\|kotlin" libausbc/build.gradle || echo "(no kotlin plugins - good)"

      - name: Restore optional signing key
        env:
          ROVER_SIGNING_P12_B64: ${{ secrets.ROVER_SIGNING_P12_B64 }}
        run: |
          if [ -n "$ROVER_SIGNING_P12_B64" ]; then
            mkdir -p signing

            printf '%s' "$ROVER_SIGNING_P12_B64" \
              | base64 --decode \
              > signing/roverd-update.p12

            chmod 600 signing/roverd-update.p12
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk roverd-android-debug.apk

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug roverd-android-debug.apk --clobber
          else
            gh release create latest-debug roverd-android-debug.apk \
              --title "Latest Roverd Debug APK" \
              --notes "Roverd with Logitech C920 UVC camera support and 180-degree camera inversion."
          fi
