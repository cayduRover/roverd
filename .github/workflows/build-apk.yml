name: Build Roverd APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble modified Android source
        run: |
          set -e

          if [ -f "roverd-android-source.zip" ]; then
            echo "Using roverd-android-source.zip"
            rm -rf _android_source
            mkdir -p _android_source
            unzip -q roverd-android-source.zip -d _android_source
            cp -a _android_source/. .
            rm -rf _android_source
          elif compgen -G "payload/part*" > /dev/null; then
            echo "Using payload parts"
            cat payload/part* > /tmp/roverd-source.b64
            base64 --decode /tmp/roverd-source.b64 > /tmp/roverd-source.zip

            rm -rf _android_source
            mkdir -p _android_source
            unzip -q /tmp/roverd-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source
            rm -f /tmp/roverd-source.b64 /tmp/roverd-source.zip
          else
            echo "ERROR: No Android source ZIP or payload parts found."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Get AndroidUSBCamera source
        run: |
          set -e
          rm -rf /tmp/AndroidUSBCamera

          git clone \
            --depth 1 \
            --branch 3.3.3 \
            https://github.com/jiangdongguo/AndroidUSBCamera.git \
            /tmp/AndroidUSBCamera

      - name: Add AndroidUSBCamera modules
        run: |
          set -e

          for module in libausbc libuvc libnative libutils libuvccommon; do
            if [ ! -d "/tmp/AndroidUSBCamera/$module" ]; then
              echo "ERROR: Missing module $module in AndroidUSBCamera source."
              exit 1
            fi

            rm -rf "$module"
            cp -a "/tmp/AndroidUSBCamera/$module" "./$module"
          done

      - name: Patch Gradle for local AndroidUSBCamera modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")

          if settings.exists():
              s = settings.read_text()

              includes = [
                  'include(":libausbc")',
                  'include(":libuvc")',
                  'include(":libnative")',
                  'include(":libutils")',
                  'include(":libuvccommon")',
              ]

              for inc in includes:
                  if inc not in s:
                      s += "\n" + inc

              settings.write_text(s)
          else:
              print("WARNING: settings.gradle.kts not found")

          app_gradle = Path("app/build.gradle.kts")
          s = app_gradle.read_text()

          old_dependencies = [
              'implementation("com.github.jiangdongguo:AndroidUSBCamera:3.3.3")',
              "implementation('com.github.jiangdongguo:AndroidUSBCamera:3.3.3')",
          ]

          for old in old_dependencies:
              s = s.replace(
                  old,
                  'implementation(project(":libausbc"))'
              )

          app_gradle.write_text(s)
          PY

      - name: Show AndroidUSBCamera configuration
        run: |
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts

          echo
          echo "=== app/build.gradle.kts ==="
          cat app/build.gradle.kts

      - name: Restore optional signing key
        env:
          ROVER_SIGNING_P12_B64: ${{ secrets.ROVER_SIGNING_P12_B64 }}
        run: |
          if [ -n "$ROVER_SIGNING_P12_B64" ]; then
            mkdir -p signing

            printf '%s' "$ROVER_SIGNING_P12_B64" \
              | base64 --decode \
              > signing/roverd-update.p12

            chmod 600 signing/roverd-update.p12
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk roverd-android-debug.apk

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload \
              latest-debug \
              roverd-android-debug.apk \
              --clobber
          else
            gh release create \
              latest-debug \
              roverd-android-debug.apk \
              --title "Latest Roverd Debug APK" \
              --notes "Roverd with Logitech C920 UVC camera support and 180-degree camera inversion."
          fi
