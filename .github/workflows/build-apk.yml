name: Build Roverd APK

on:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip git

      - name: Restore Roverd source
        run: |
          set -e

          if [ -f "roverd-android-source.zip" ]; then
            rm -rf _android_source
            mkdir -p _android_source
            unzip -q roverd-android-source.zip -d _android_source
            cp -a _android_source/. .
            rm -rf _android_source

          elif compgen -G "payload/part*" > /dev/null; then
            cat payload/part* > /tmp/roverd-source.b64
            base64 --decode /tmp/roverd-source.b64 > /tmp/roverd-source.zip

            rm -rf _android_source
            mkdir -p _android_source
            unzip -q /tmp/roverd-source.zip -d _android_source
            cp -a _android_source/. .

            rm -rf _android_source
            rm -f /tmp/roverd-source.b64
            rm -f /tmp/roverd-source.zip

          else
            echo "ERROR: Android source not found."
            exit 1
          fi

      # ============================================================
      # JAVA 17 FIRST
      # sdkmanager requires Java 17+
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Java version
        run: |
          java -version

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.10.2"

      # ============================================================
      # VERIFY CMAKE + NDK
      # ============================================================
      - name: Verify native build tools
        run: |
          set -e

          echo "SDK: $ANDROID_SDK_ROOT"
          echo "NDK: $ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"
          test -d "$ANDROID_SDK_ROOT/cmake/3.10.2"

          "$ANDROID_SDK_ROOT/cmake/3.10.2/bin/cmake" --version
          "$ANDROID_NDK_HOME/ndk-build" --version

      # ============================================================
      # DOWNLOAD AUSBC
      # ============================================================
      - name: Download AndroidUSBCamera 3.3.3
        run: |
          set -e

          rm -rf /tmp/AndroidUSBCamera

          git clone \
            --depth 1 \
            --branch 3.3.3 \
            https://github.com/jiangdongguo/AndroidUSBCamera.git \
            /tmp/AndroidUSBCamera

          test -f /tmp/AndroidUSBCamera/gradlew
          test -d /tmp/AndroidUSBCamera/libausbc
          test -d /tmp/AndroidUSBCamera/libuvc
          test -d /tmp/AndroidUSBCamera/libnative
          test -d /tmp/AndroidUSBCamera/libuvccommon

      # ============================================================
      # JAVA 8 ONLY AFTER SDK/CMAKE INSTALLATION
      # AUSBC 3.3.3 uses old Gradle 6.7.1
      # ============================================================
      - name: Set up Java 8 for AndroidUSBCamera
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Show Java version for AndroidUSBCamera
        run: |
          java -version

      # ============================================================
      # CREATE AUSBC LOCAL.PROPERTIES
      # ============================================================
      - name: Create AndroidUSBCamera local.properties
        working-directory: /tmp/AndroidUSBCamera
        run: |
          set -e

          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          ndk.dir=${ANDROID_NDK_HOME}
          EOF

          echo "===== local.properties ====="
          cat local.properties

      # ============================================================
      # BUILD AUSBC
      #
      # NO libutils
      #
      # libausbc uses:
      #   libuvc
      #   libnative
      #
      # libuvc uses:
      #   libuvccommon
      # ============================================================
      - name: Build AndroidUSBCamera
        working-directory: /tmp/AndroidUSBCamera
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

          ./gradlew \
            :libuvccommon:assembleRelease \
            :libnative:assembleRelease \
            :libuvc:assembleRelease \
            :libausbc:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY AARS
      # ============================================================
      - name: Verify AndroidUSBCamera AARs
        run: |
          set -e

          test -f /tmp/AndroidUSBCamera/libuvccommon/build/outputs/aar/libuvccommon-release.aar
          test -f /tmp/AndroidUSBCamera/libnative/build/outputs/aar/libnative-release.aar
          test -f /tmp/AndroidUSBCamera/libuvc/build/outputs/aar/libuvc-release.aar
          test -f /tmp/AndroidUSBCamera/libausbc/build/outputs/aar/libausbc-release.aar

          echo "AUSBC AARs built successfully."

      # ============================================================
      # COPY AARS INTO ROVERD
      # ============================================================
      - name: Copy AndroidUSBCamera AARs
        run: |
          set -e

          mkdir -p app/libs

          cp \
            /tmp/AndroidUSBCamera/libuvccommon/build/outputs/aar/libuvccommon-release.aar \
            app/libs/ausbc-libuvccommon-release.aar

          cp \
            /tmp/AndroidUSBCamera/libnative/build/outputs/aar/libnative-release.aar \
            app/libs/ausbc-libnative-release.aar

          cp \
            /tmp/AndroidUSBCamera/libuvc/build/outputs/aar/libuvc-release.aar \
            app/libs/ausbc-libuvc-release.aar

          cp \
            /tmp/AndroidUSBCamera/libausbc/build/outputs/aar/libausbc-release.aar \
            app/libs/ausbc-libausbc-release.aar

          echo "===== app/libs ====="
          ls -lh app/libs

      # ============================================================
      # PATCH APP DEPENDENCY
      # ============================================================
      - name: Patch app dependency
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          text = path.read_text()

          patterns = [
              r'^\s*implementation\s*\(\s*"com\.github\.jiangdongguo[.:]AndroidUSBCamera[^"]*"\s*\)\s*$',
              r"^\s*implementation\s*\(\s*'com\.github\.jiangdongguo[.:]AndroidUSBCamera[^']*'\s*\)\s*$",
              r'^\s*implementation\s+"com\.github\.jiangdongguo[.:]AndroidUSBCamera[^"]*"\s*$',
              r"^\s*implementation\s+'com\.github\.jiangdongguo[.:]AndroidUSBCamera[^']*'\s*$",
              r'^\s*implementation\s*\(\s*project\s*\(\s*":libausbc"\s*\)\s*\)\s*$',
          ]

          for pattern in patterns:
              text = re.sub(
                  pattern,
                  "",
                  text,
                  flags=re.MULTILINE
              )

          aar_pattern = (
              r'\s*implementation\(files\(\s*'
              r'"libs/ausbc-libuvccommon-release\.aar",\s*'
              r'"libs/ausbc-libnative-release\.aar",\s*'
              r'"libs/ausbc-libuvc-release\.aar",\s*'
              r'"libs/ausbc-libausbc-release\.aar"\s*'
              r'\)\)'
          )

          text = re.sub(
              aar_pattern,
              "",
              text,
              flags=re.MULTILINE
          )

          aar_block = '''    implementation(files(
              "libs/ausbc-libuvccommon-release.aar",
              "libs/ausbc-libnative-release.aar",
              "libs/ausbc-libuvc-release.aar",
              "libs/ausbc-libausbc-release.aar"
          ))
          '''

          if "dependencies {" not in text:
              raise SystemExit(
                  "ERROR: dependencies { block not found"
              )

          text = text.replace(
              "dependencies {",
              "dependencies {\n" + aar_block,
              1
          )

          path.write_text(text)

          print("AUSBC dependency patched successfully.")
          PY

      # ============================================================
      # VERIFY ROVERD CONFIG
      # ============================================================
      - name: Verify Roverd configuration
        run: |
          set -e

          chmod +x gradlew

          echo "===== Java ====="
          java -version

          echo
          echo "===== Roverd Gradle ====="
          ./gradlew --version

          echo
          echo "===== AUSBC references ====="
          grep -n \
            "ausbc-\|AndroidUSBCamera" \
            app/build.gradle.kts \
            || true

          echo
          echo "===== AARs ====="
          ls -lh app/libs/

      # ============================================================
      # JAVA 17 FOR ROVERD
      # ============================================================
      - name: Set up Java 17 for Roverd
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Java version for Roverd
        run: |
          java -version

      # ============================================================
      # OPTIONAL SIGNING
      # ============================================================
      - name: Restore optional signing key
        env:
          ROVER_SIGNING_P12_B64: ${{ secrets.ROVER_SIGNING_P12_B64 }}
        run: |
          set -e

          if [ -n "$ROVER_SIGNING_P12_B64" ]; then
            mkdir -p signing

            printf '%s' "$ROVER_SIGNING_P12_B64" \
              | base64 --decode \
              > signing/roverd-update.p12

            chmod 600 signing/roverd-update.p12

            echo "Signing key restored."
          fi

      # ============================================================
      # BUILD ROVERD
      # ============================================================
      - name: Build Roverd debug APK
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roverd-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ============================================================
      # RELEASE
      # ============================================================
      - name: Publish latest debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          cp "$APK" roverd-android-debug.apk

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload \
              latest-debug \
              roverd-android-debug.apk \
              --clobber
          else
            gh release create \
              latest-debug \
              roverd-android-debug.apk \
              --title "Latest Roverd Debug APK" \
              --notes "Roverd with Logitech C920 UVC camera support and 180-degree camera inversion."
          fi
